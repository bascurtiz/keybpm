<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161616" />
    <script>
      // Apply stored theme choice before first paint (no flash).
      try {
        var t = localStorage.getItem('keydb-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <meta name="description" content="Real tracks. Real people. Real musical data. Help build the most accurate, community-driven database for key, bpm and more." />
    <title>KeyBPM — Open Music Key & BPM Database</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KeyBPM" />
    <meta property="og:title" content="KeyBPM — Open Music Key & BPM Database" />
    <meta property="og:description" content="Real tracks. Real people. Real musical data. Help build the most accurate, community-driven database for key, bpm and more." />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
