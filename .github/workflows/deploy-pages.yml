name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Project pages are served from /<repo>/; set BASE_PATH to "/" for a custom domain.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # SPA fallback: GitHub Pages serves 404.html for unknown paths like /track/<id>.
      - run: cp dist/index.html dist/404.html && rm -f dist/_redirects
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
